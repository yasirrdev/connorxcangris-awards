services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: awards
      POSTGRES_USER: awards_local
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD para la base local}
    ports:
      - "127.0.0.1:${AWARDS_COMPOSE_DB_PORT:-55433}:5432"
    volumes:
      - awards_postgres:/var/lib/postgresql/data
      - ./db/001.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/002-demo.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U awards_local -d awards"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  awards_postgres:

